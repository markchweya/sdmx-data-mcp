[project]
name = "sdmx-data-mcp"
version = "0.1.0"
description = "An MCP server that discovers and retrieves official statistics from SDMX services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mark Chweya" }]
keywords = ["sdmx", "mcp", "statistics", "pysdmx", "bis"]
dependencies = [
    "pysdmx[data]>=1.18.0",
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
sdmx-data-mcp = "sdmx_data_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/markchweya/sdmx-data-mcp"
Issues = "https://github.com/markchweya/sdmx-data-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdmx_data_mcp"]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "C90", "D", "DTZ", "E", "ERA", "F", "FURB", "I", "LOG", "PERF", "PT", "S", "SIM", "W"]
ignore = ["D411", "E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C901", "DTZ", "D100", "D103", "D104", "PERF", "S101", "S311"]
"scripts/*" = ["D100", "D103", "S101", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src"]
strict = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_return_any = false
enable_error_code = ["redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["pysdmx.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
