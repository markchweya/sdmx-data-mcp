name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is
# stored in this repository. Configure it once at
# https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : sdmx-data-mcp
#   Owner             : markchweya
#   Repository        : sdmx-data-mcp
#   Workflow          : publish.yml
#   Environment       : pypi
#
# Then publishing is triggered by creating a GitHub release.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: python -m pip install build twine && python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing. No PyPI token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
